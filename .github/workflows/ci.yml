name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting
        run: black --check src tests

      - name: Unit tests
        run: pytest

      - name: Generate synthetic data
        run: python -m src.generate

      - name: Validate (includes reproducibility check)
        run: python -m src.validate

      - name: S1 foundation (cleaning, entity resolution, customer_activity)
        run: python -m src.foundation

      - name: S2 features (links, alert features, risk tiers)
        run: python -m src.features

      - name: S3 agent harness (offline baseline, no API calls)
        run: python -m src.agent --backend baseline

      - name: S4 re-point to US outbound
        run: python -m src.repoint

      - name: S4 end-to-end evaluation (baseline on every Medium/High alert)
        run: |
          python -m src.agent --backend baseline --all
          python -m src.evaluate --results data/exports/agent_results_baseline_all.csv --out data/exports/eval_report_baseline.md

      - name: Upload data summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-summary
          path: |
            data/raw/_summary.md
            data/derived/_s1_expected.md
            data/derived/_s2_expected.md
            data/exports/agent_test_report.md
            data/derived/_s4_expected.md
            data/exports/eval_report_baseline.md
          if-no-files-found: ignore
