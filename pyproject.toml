[project]
name = "remittance-integrity"
version = "0.1.0"
description = "Synthetic data, specs, and evaluation for the Remittance Integrity Command Center (Palantir AIP)."
requires-python = ">=3.11"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
